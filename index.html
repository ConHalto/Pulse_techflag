<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pulse Tech Flag — ConHalto</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8FAFC;color:#1E293B;font-size:15px;padding-bottom:40px;}
.header{background:#EF4444;color:#fff;padding:20px;text-align:center;}
.header h1{font-size:20px;font-weight:700;margin-bottom:4px;}
.header p{font-size:13px;opacity:.85;}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin:16px;padding:20px;}
label{display:block;font-size:12px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid #CBD5E1;border-radius:8px;font-size:15px;font-family:inherit;color:#1E293B;background:#fff;outline:none;-webkit-appearance:none;}
input:focus,select:focus,textarea:focus{border-color:#EF4444;box-shadow:0 0 0 3px rgba(239,68,68,.12);}
textarea{min-height:100px;resize:vertical;}
.form-group{margin-bottom:16px;}
.urg-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.urg-btn{padding:12px 8px;border:2px solid #CBD5E1;border-radius:8px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;text-align:center;color:#475569;transition:all .15s;}
.urg-btn.active-low{border-color:#94A3B8;background:#F1F5F9;color:#334155;}
.urg-btn.active-high{border-color:#F59E0B;background:#FFFBEB;color:#92400E;}
.urg-btn.active-crit{border-color:#EF4444;background:#FEF2F2;color:#991B1B;}
.submit-btn{width:100%;padding:16px;background:#EF4444;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.02em;}
.submit-btn:active{background:#DC2626;}
.result-panel{display:none;background:#F0FDF4;border:2px solid #86EFAC;border-radius:12px;padding:20px;margin:16px;}
.result-panel h2{color:#166534;font-size:16px;margin-bottom:10px;}
.code-box{background:#1E293B;color:#86EFAC;font-family:monospace;font-size:12px;padding:14px;border-radius:8px;word-break:break-all;margin-bottom:12px;line-height:1.6;}
.copy-btn{width:100%;padding:12px;background:#166534;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.footer{text-align:center;font-size:12px;color:#94A3B8;margin-top:24px;}
img#photo-preview{max-width:100%;border-radius:8px;margin-top:8px;display:none;}
</style>
</head>
<body>
<div class="header">
  <h1>⚡ Pulse Tech Flag</h1>
  <p>ConHalto National Support — raise an issue for manager review</p>
</div>
<div class="card">
  <div class="form-group">
    <label>Your Name *</label>
    <select id="f-tech">
      <option value="">— Select —</option>
      <option value="Boris I">Boris I</option><option value="Mark H">Mark H</option><option value="Sean B">Sean B</option><option value="Pezi A">Pezi A</option><option value="Shane A">Shane A</option><option value="Richard W">Richard W</option><option value="Vito T">Vito T</option><option value="Sales Team">Sales Team</option><option value="Customer">Customer</option><option value="Stephen O">Stephen O</option><option value="Mauro R">Mauro R</option><option value="Service Admin">Service Admin</option><option value="Con H">Con H</option><option value="Seng C">Seng C</option>
    </select>
  </div>
  <label>Urgency *</label>
  <div class="urg-grid">
    <button type="button" class="urg-btn" onclick="setUrg('Low',this)">Low</button>
    <button type="button" class="urg-btn" onclick="setUrg('High',this)">High</button>
    <button type="button" class="urg-btn" onclick="setUrg('Critical',this)">🔴 Critical</button>
  </div>
  <input type="hidden" id="f-urg" value="">
  <div class="form-group">
    <label>Customer</label>
    <input type="text" id="f-cust" placeholder="e.g. Northgate Foods">
  </div>
  <div class="form-group">
    <label>Model</label>
    <select id="f-model">
      <option value="">— Select —</option>
      <option value="VJ1000 (1210, 1510, 1610)">VJ1000 (1210, 1510, 1610)</option><option value="VJ1710">VJ1710</option><option value="TIJ">TIJ</option><option value="Other">Other</option><option value="Laser 3640">Laser 3640</option><option value="VJ1880 / 1880Plus">VJ1880 / 1880Plus</option><option value="VJ1280">VJ1280</option><option value="VJ1580 / 1580Plus">VJ1580 / 1580Plus</option><option value="VJ9550 / 9560">VJ9550 / 9560</option><option value="VJ8520">VJ8520</option><option value="Laser VJ3340">Laser VJ3340</option><option value="VJ6330/6530 TTO">VJ6330/6530 TTO</option><option value="Tronics Labeller">Tronics Labeller</option><option value="VJ2380">VJ2380</option><option value="VJ6230 TTO">VJ6230 TTO</option><option value="SATO S84NX Print Engine">SATO S84NX Print Engine</option>
    </select>
  </div>
  <div class="form-group">
    <label>Serial Number</label>
    <input type="text" id="f-serial" placeholder="e.g. AB12345678" autocomplete="off">
  </div>
  <div class="form-group">
    <label>Fault Category</label>
    <select id="f-faultcat">
      <option value="">— Select —</option>
      <option value="Electrical">Electrical</option><option value="Mechanical">Mechanical</option><option value="Software / Firmware">Software / Firmware</option><option value="Consumables">Consumables</option><option value="Operator Error">Operator Error</option><option value="Unknown">Unknown</option><option value="Installation">Installation</option><option value="Ink System">Ink System</option><option value="EHT Fault">EHT Fault</option><option value="Gutter Fault">Gutter Fault</option><option value="CIJ Unknown">CIJ Unknown</option><option value="Print Quality">Print Quality</option><option value="Phone Support">Phone Support</option>
    </select>
  </div>
  <div class="form-group">
    <label>Issue Description *</label>
    <textarea id="f-desc" placeholder="Describe the issue in detail. What happened? What did you try?"></textarea>
  </div>
  <div class="form-group">
    <label>Photo (optional)</label>
    <input type="file" id="f-photo" accept="image/*" capture="environment" onchange="loadPhoto(this)">
    <img id="photo-preview">
  </div>
  <button class="submit-btn" onclick="submit()">Submit Flag</button>
</div>
<div class="result-panel" id="result">
  <h2>✅ Flag Ready to Send</h2>
  <p style="font-size:13px;color:#166534;margin-bottom:12px;">Copy this code and send it to Con H via WhatsApp or Teams:</p>
  <div class="code-box" id="result-code"></div>
  <button class="copy-btn" onclick="copyCode()">Copy Code</button>
  <p style="font-size:12px;color:#166534;margin-top:10px;text-align:center;">Your manager will paste this code into Pulse → Flags → Import Code</p>
</div>
<div class="footer">Pulse by ConHalto · Generated 25/07/2026</div>
<script>
let _photoB64='';
function setUrg(val,btn){
  document.getElementById('f-urg').value=val;
  document.querySelectorAll('.urg-btn').forEach(b=>b.className='urg-btn');
  btn.className='urg-btn active-'+(val==='Low'?'low':val==='High'?'high':'crit');
}
function loadPhoto(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      const maxW=400;
      const scale=Math.min(1,maxW/img.width);
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      _photoB64=canvas.toDataURL('image/jpeg',0.65);
      const prev=document.getElementById('photo-preview');
      prev.src=_photoB64;prev.style.display='';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function submit(){
  const tech=document.getElementById('f-tech').value;
  const urg=document.getElementById('f-urg').value;
  const desc=document.getElementById('f-desc').value.trim();
  if(!tech){alert('Please select your name');return;}
  if(!urg){alert('Please select urgency');return;}
  if(!desc){alert('Please describe the issue');return;}
  const flag={id:'FLAG-'+Date.now(),
    date:new Date().toISOString().split('T')[0],
    time:new Date().toTimeString().slice(0,5),
    tech,urgency:urg,desc,
    customer:document.getElementById('f-cust').value.trim(),
    model:document.getElementById('f-model').value,
    serial:document.getElementById('f-serial').value.trim(),
    faultCat:document.getElementById('f-faultcat').value,
    photo:_photoB64,status:'Open',response:''};
  try{var code=btoa(unescape(encodeURIComponent(JSON.stringify(flag))));}catch(e){alert('Could not generate code — check for unusual characters');return;}
  document.getElementById('result-code').textContent=code;
  document.getElementById('result').style.display='';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function copyCode(){
  const code=document.getElementById('result-code').textContent;
  if(navigator.clipboard){navigator.clipboard.writeText(code).then(()=>alert('Code copied!'));}
  else{const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('Code copied!');}
}
</script>
</body>
</html>
